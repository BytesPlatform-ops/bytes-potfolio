<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bia Zane">
  <!-- The period from "BIA Z.", on its own. A letterform at 16px turns to
       mush; a single dot does not.

       Deliberately cream in both colour schemes. An ink ground swapped in
       under prefers-color-scheme: dark disappears into a dark tab bar and
       leaves the dot floating with no shape; paper holds its edge against
       either bar, which is the whole job of a favicon. -->
  <rect width="64" height="64" rx="14" fill="#f2eee3"/>
  <circle cx="32" cy="32" r="13" fill="#f34e32"/>
</svg>
